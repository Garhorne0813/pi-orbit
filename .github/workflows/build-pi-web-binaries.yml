name: Build Pi Web Binaries

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source branch, tag, or commit to build
        required: true
        default: main
        type: string
      create_release:
        description: Create a GitHub Release with the binary archives
        required: true
        default: false
        type: boolean
      release_tag:
        description: Release tag (required when creating a release, for example pi-web-v0.1.0)
        required: false
        type: string

permissions: {}

concurrency:
  group: build-pi-web-binaries-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build cross-platform binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Hydrate model data
        run: npm run hydrate:model-data

      - name: Build binaries
        run: |
          set -euo pipefail

          ./scripts/build-binaries.sh \
            --offline-model-data \
            --out "${GITHUB_WORKSPACE}/packages/coding-agent/binaries"

      - name: Package Pi Web executables
        run: |
          set -euo pipefail

          binaries_dir="${GITHUB_WORKSPACE}/packages/coding-agent/binaries"
          assets_dir="${GITHUB_WORKSPACE}/pi-web-assets"
          work_dir="$(mktemp -d)"
          trap 'rm -rf "${work_dir}"' EXIT
          mkdir -p "${assets_dir}"

          unix_platforms=(darwin-arm64 darwin-x64 linux-x64 linux-arm64)
          for platform in "${unix_platforms[@]}"; do
            platform_dir="${work_dir}/${platform}"
            mkdir -p "${platform_dir}"
            tar -xzf "${binaries_dir}/pi-${platform}.tar.gz" -C "${platform_dir}"
            mv "${platform_dir}/pi" "${platform_dir}/pi-web"
            mv "${platform_dir}/pi-web/pi" "${platform_dir}/pi-web/pi-web"
            tar -czf "${assets_dir}/pi-web-${platform}.tar.gz" -C "${platform_dir}" pi-web
          done

          windows_platforms=(windows-x64 windows-arm64)
          for platform in "${windows_platforms[@]}"; do
            platform_dir="${work_dir}/${platform}/pi-web"
            mkdir -p "${platform_dir}"
            unzip -q "${binaries_dir}/pi-${platform}.zip" -d "${platform_dir}"
            mv "${platform_dir}/pi.exe" "${platform_dir}/pi-web.exe"
            (
              cd "${work_dir}/${platform}"
              zip -qr "${assets_dir}/pi-web-${platform}.zip" pi-web
            )
          done

          cd "${assets_dir}"
          sha256sum pi-web-*.tar.gz pi-web-*.zip > SHA256SUMS

      - name: Upload Pi Web binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pi-web-binaries-${{ github.run_number }}
          path: pi-web-assets/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    if: ${{ inputs.create_release }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          if [[ -z "${RELEASE_TAG}" ]]; then
            echo "::error::release_tag is required when create_release is enabled."
            exit 1
          fi

      - name: Download Pi Web binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pi-web-binaries-${{ github.run_number }}
          path: pi-web-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "::error::GitHub Release ${RELEASE_TAG} already exists."
            exit 1
          fi

          gh release create "${RELEASE_TAG}" \
            --target "${SOURCE_REF}" \
            --title "Pi Web ${RELEASE_TAG}" \
            --generate-notes \
            pi-web-assets/*
